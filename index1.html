</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="topbar-title">&#9670; ABAP Programs Vault</span>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <circle cx="6.5" cy="6.5" r="4.5"/>
        <line x1="10.5" y1="10.5" x2="14" y2="14"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search by name, tag, T-code..." oninput="renderList()">
    </div>
    <button class="add-btn" onclick="openModal()">+ Add Program</button>
  </div>
  <div class="main">
    <div class="list-panel" id="listPanel"></div>
    <div class="detail-panel" id="detailPanel">
      <div class="empty-state">
        <div class="empty-icon">&#128196;</div>
        <span>Select a program to view details</span>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Add Program</h3>
    <div class="field-group">
      <div class="field-label">Program Name *</div>
      <input class="field-input" id="fName" placeholder="e.g. Z_HELLO_WORLD">
    </div>
    <div class="field-group">
      <div class="field-label">Description *</div>
      <input class="field-input" id="fDesc" placeholder="What does this program do?">
    </div>
    <div class="field-group">
      <div class="field-label">T-Code (optional)</div>
      <input class="field-input" id="fTcode" placeholder="e.g. SE38">
    </div>
    <div class="field-group">
      <div class="field-label">Category</div>
      <select class="field-select" id="fCategory">
        <option value="">-- Select Category --</option>
        <option value="Report">Report</option>
        <option value="BAPI">BAPI</option>
        <option value="Function Module">Function Module</option>
        <option value="Class">Class</option>
        <option value="DDIC">DDIC</option>
        <option value="ALV">ALV</option>
        <option value="OOP">OOP</option>
        <option value="Internal Tables">Internal Tables</option>
        <option value="Smartforms">Smartforms</option>
        <option value="Enhancement">Enhancement</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div class="field-group">
      <div class="field-label">Tags (comma-separated, optional)</div>
      <input class="field-input" id="fTags" placeholder="e.g. S/4HANA, ECC 6.0, Basics">
    </div>
    <div class="field-group">
      <div class="field-label">ABAP Code *</div>
      <textarea class="field-textarea" id="fCode" placeholder="Paste your ABAP code here..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="save-btn" onclick="saveProgram()">Save Program</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const API = 'http://localhost:5000';
  let programs = [];
  let selectedId = null;
  let editingId = null;

  function escHtml(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function showToast(msg, type = 'success') {
    const t = document.getElementById('toast');
    t.textContent = type === 'success' ? '✓ ' + msg : '✕ ' + msg;
    t.className = 'toast' + (type === 'error' ? ' error' : '');
    t.style.display = 'block';
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.style.display = 'none', 3000);
  }

  async function loadPrograms() {
    try {
      const res = await fetch(`${API}/programs`);
      programs = await res.json();
      renderList();
      if (programs.length > 0 && !selectedId) selectProgram(programs[0].id);
    } catch(e) {
      document.getElementById('listPanel').innerHTML =
        `<div class="server-err">&#9888; Cannot connect to server.<br>Make sure you ran: <b>py server.py</b></div>`;
    }
  }

  function renderList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const panel = document.getElementById('listPanel');
    const filtered = programs.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.description.toLowerCase().includes(q) ||
      (p.tcode && p.tcode.toLowerCase().includes(q)) ||
      (p.tags && p.tags.toLowerCase().includes(q))
    );
    if (programs.length === 0) {
      panel.innerHTML = '<div class="no-results">No programs yet.<br>Click "+ Add Program"</div>';
      return;
    }
    if (filtered.length === 0) {
      panel.innerHTML = '<div class="no-results">No matches found.</div>';
      return;
    }
    panel.innerHTML = `<div class="list-count">${filtered.length} program${filtered.length !== 1 ? 's' : ''}</div>` +
      filtered.map(p => {
        const allTags = [
          ...(p.tags ? p.tags.split(',').map(t => t.trim()).filter(Boolean) : [])
        ];
        return `
          <div class="prog-item ${p.id === selectedId ? 'active' : ''}" onclick="selectProgram(${p.id})">
            <div class="prog-item-name">${escHtml(p.name)}</div>
            <div class="prog-item-desc">${escHtml(p.description)}</div>
            <div class="prog-item-tags">
              ${allTags.slice(0,4).map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}
            </div>
          </div>`;
      }).join('');
  }

  function selectProgram(id) {
    selectedId = id;
    renderList();
    const p = programs.find(x => x.id === id);
    if (!p) return;
    const allTags = p.tags ? p.tags.split(',').map(t => t.trim()).filter(Boolean) : [];
    document.getElementById('detailPanel').innerHTML = `
      <div>
        <div class="detail-title">${escHtml(p.name)}</div>
        <div class="detail-desc">${escHtml(p.description)}</div>
      </div>
      <div class="meta-row">
        ${p.tcode ? `<span class="meta-badge">T-Code: ${escHtml(p.tcode)}</span>` : ''}
        <span class="meta-badge">&#128197; ${escHtml(p.date)}</span>
        ${allTags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}
      </div>
      <div class="code-block">
        <div class="code-header">
          <span class="code-label">ABAP CODE</span>
          <div class="code-actions">
            <button class="code-btn" onclick="copyCode(${id})">&#128203; Copy</button>
            <button class="code-btn" onclick="editProgram(${id})">&#9998; Edit</button>
            <div class="export-wrap" id="exportWrap_${id}">
              <button class="code-btn green" onclick="toggleExportMenu(${id})">&#8659; Export</button>
              <div class="export-menu" id="exportMenu_${id}">
                <div class="export-menu-item" onclick="exportAbap(${id})">&#128196; Download as .abap</div>
                <div class="export-menu-item" onclick="exportJson(${id})">&#123;&#125; Download as .json</div>
              </div>
            </div>
          </div>
        </div>
        <div class="code-content">${escHtml(p.code)}</div>
      </div>
      <div class="detail-actions">
        <button class="edit-btn" onclick="editProgram(${id})">&#9998; Edit Program</button>
        <button class="del-btn" onclick="deleteProgram(${id})">&#10005; Delete</button>
      </div>
    `;
  }

  function toggleExportMenu(id) {
    const menu = document.getElementById(`exportMenu_${id}`);
    menu.classList.toggle('open');
    // close on outside click
    setTimeout(() => {
      document.addEventListener('click', function handler(e) {
        if (!document.getElementById(`exportWrap_${id}`).contains(e.target)) {
          menu.classList.remove('open');
          document.removeEventListener('click', handler);
        }
      });
    }, 0);
  }

  async function exportAbap(id) {
    try {
      const res = await fetch(`${API}/programs/${id}/export/abap`);
      if (!res.ok) throw new Error('Export failed');
      const text = await res.text();
      const p = programs.find(x => x.id === id);
      const filename = (p ? p.name : 'program') + '.abap';
      triggerDownload(text, filename, 'text/plain');
      showToast('Downloaded as .abap!');
    } catch(e) {
      showToast('Export failed. Is server running?', 'error');
    }
  }

  async function exportJson(id) {
    try {
      const res = await fetch(`${API}/programs/${id}/export/json`);
      if (!res.ok) throw new Error('Export failed');
      const text = await res.text();
      const p = programs.find(x => x.id === id);
      const filename = (p ? p.name : 'program') + '.json';
      triggerDownload(text, filename, 'application/json');
      showToast('Downloaded as .json!');
    } catch(e) {
      showToast('Export failed. Is server running?', 'error');
    }
  }

  function triggerDownload(content, filename, mimeType) {
    const blob = new Blob([content], { type: mimeType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function copyCode(id) {
    const p = programs.find(x => x.id === id);
    if (!p) return;
    await navigator.clipboard.writeText(p.code);
    showToast('Code copied to clipboard!');
  }

  async function deleteProgram(id) {
    if (!confirm('Delete this program? This cannot be undone.')) return;
    await fetch(`${API}/programs/${id}`, { method: 'DELETE' });
    const remaining = programs.filter(x => x.id !== id);
    selectedId = null;
    await loadPrograms();
    if (remaining.length > 0) selectProgram(remaining[0].id);
    else document.getElementById('detailPanel').innerHTML =
      `<div class="empty-state"><div class="empty-icon">&#128196;</div><span>Select a program</span></div>`;
    showToast('Program deleted.');
  }

  function openModal(id) {
    editingId = id || null;
    const p = id ? programs.find(x => x.id === id) : null;
    document.getElementById('modalTitle').textContent = p ? 'Edit Program' : 'Add Program';
    document.getElementById('fName').value = p ? p.name : '';
    document.getElementById('fDesc').value = p ? p.description : '';
    document.getElementById('fTcode').value = p ? (p.tcode || '') : '';
    document.getElementById('fTags').value = p ? (p.tags || '') : '';
    document.getElementById('fCode').value = p ? p.code : '';
    // set category
    const catSelect = document.getElementById('fCategory');
    catSelect.value = '';
    if (p && p.tags) {
      const cats = ['Report','BAPI','Function Module','Class','DDIC','ALV','OOP','Internal Tables','Smartforms','Enhancement','Other'];
      const found = p.tags.split(',').map(t => t.trim()).find(t => cats.includes(t));
      if (found) catSelect.value = found;
    }
    document.getElementById('modalBg').classList.add('open');
    setTimeout(() => document.getElementById('fName').focus(), 100);
  }

  function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
  function editProgram(id) { openModal(id); }

  async function saveProgram() {
    const name = document.getElementById('fName').value.trim();
    const description = document.getElementById('fDesc').value.trim();
    const code = document.getElementById('fCode').value.trim();
    if (!name || !description || !code) {
      showToast('Name, description and code are required.', 'error');
      return;
    }
    const category = document.getElementById('fCategory').value;
    const rawTags = document.getElementById('fTags').value.trim();
    // merge category into tags
    let tagsArr = rawTags ? rawTags.split(',').map(t => t.trim()).filter(Boolean) : [];
    if (category && !tagsArr.includes(category)) tagsArr.unshift(category);
    const tags = tagsArr.join(', ');

    const payload = {
      name, description, code, tags,
      tcode: document.getElementById('fTcode').value.trim(),
      date: new Date().toLocaleDateString('en-IN')
    };

    try {
      if (editingId) {
        await fetch(`${API}/programs/${editingId}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        showToast('Program updated!');
      } else {
        await fetch(`${API}/programs`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        showToast('Program saved!');
      }
      closeModal();
      await loadPrograms();
      if (editingId) selectProgram(editingId);
      else if (programs.length > 0) selectProgram(programs[0].id);
    } catch(e) {
      showToast('Failed to save. Is the server running?', 'error');
    }
  }

  document.getElementById('modalBg').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  loadPrograms();
</script>
</body>

<style>

    --navy: #0d1b2e;

    --accent: #4ea8de;

    --text: #ccd6f6;
    --text2: #8892b0;
    --border: rgba(78,168,222,0.18);
    --tag-bg: rgba(78,168,222,0.12);
    --code-bg: #0a1628;
    --font-mono: 'Courier New', monospace;
  }

  .topbar { background: var(--navy2); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); gap: 10px; flex-wrap: wrap; flex-shrink: 0; }
  .topbar-title { font-size: 16px; font-weight: 600; color: var(--accent); letter-spacing: 0.5px; white-space: nowrap; }
  .search-wrap { flex: 1; min-width: 160px; max-width: 360px; position: relative; }
  .search-wrap input { width: 100%; background: var(--navy); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px 8px 34px; font-size: 13px; color: var(--text); outline: none; }
  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--text2); }
  .search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; fill: none; stroke: var(--text2); stroke-width: 2; stroke-linecap: round; }
  .add-btn { background: var(--accent); color: #0a1628; border: none; border-radius: 8px; padding: 8px 16px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .add-btn:hover { background: var(--accent2); }
  .main { display: flex; flex: 1; min-height: 0; }
  .list-panel { width: 270px; min-width: 200px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--navy2); flex-shrink: 0; }
  .list-count { font-size: 11px; color: var(--text2); padding: 8px 14px 6px; border-bottom: 1px solid rgba(78,168,222,0.06); }
  .prog-item { padding: 12px 14px; cursor: pointer; border-bottom: 1px solid rgba(78,168,222,0.07); transition: background 0.15s; }
  .prog-item:hover { background: rgba(78,168,222,0.07); }
  .prog-item.active { background: rgba(78,168,222,0.13); border-left: 3px solid var(--accent); padding-left: 11px; }
  .prog-item-name { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
  .prog-item-desc { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prog-item-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
  .tag { font-size: 10px; background: var(--tag-bg); color: var(--accent); border-radius: 4px; padding: 1px 6px; border: 1px solid rgba(78,168,222,0.2); }
  .detail-panel { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text2); font-size: 13px; }
  .empty-icon { font-size: 40px; opacity: 0.3; }
  .detail-title { font-size: 18px; font-weight: 600; color: var(--accent); }
  .detail-desc { font-size: 13px; color: var(--text2); margin-top: 4px; line-height: 1.5; }
  .meta-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .meta-badge { font-size: 11px; background: rgba(100,255,218,0.08); color: var(--accent2); border: 1px solid rgba(100,255,218,0.2); border-radius: 5px; padding: 3px 9px; }
  .code-block { background: var(--code-bg); border-radius: 10px; border: 1px solid var(--border); overflow: hidden; }
  .code-header { display: flex; align-items: center; justify-content: space-between; padding: 9px 14px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.03); }
  .code-label { font-size: 11px; color: var(--text2); font-family: var(--font-mono); letter-spacing: 0.5px; }
  .code-actions { display: flex; gap: 7px; }
  .code-btn { font-size: 11px; background: var(--tag-bg); color: var(--accent); border: 1px solid rgba(78,168,222,0.22); border-radius: 5px; padding: 4px 12px; cursor: pointer; }
  .code-btn:hover { background: rgba(78,168,222,0.22); }
  .code-content { padding: 16px 18px; font-family: var(--font-mono); font-size: 13px; color: #a8d8f0; white-space: pre; overflow-x: auto; line-height: 1.75; max-height: 380px; overflow-y: auto; }
  .detail-actions { display: flex; gap: 8px; }
  .edit-btn { font-size: 12px; background: transparent; color: var(--accent); border: 1px solid var(--border); border-radius: 7px; padding: 7px 18px; cursor: pointer; }
  .edit-btn:hover { background: rgba(78,168,222,0.1); }
  .del-btn { font-size: 12px; background: transparent; color: #ff6b6b; border: 1px solid rgba(255,107,107,0.25); border-radius: 7px; padding: 7px 18px; cursor: pointer; }
  .del-btn:hover { background: rgba(255,107,107,0.1); }
  .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; align-items: center; justify-content: center; }
  .modal-bg.open { display: flex; }
  .modal { background: var(--navy2); border: 1px solid var(--border); border-radius: 14px; padding: 24px; width: 94%; max-width: 520px; max-height: 92vh; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
  .modal h3 { font-size: 16px; font-weight: 600; color: var(--accent); }
  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-label { font-size: 12px; color: var(--text2); }
  .field-input { width: 100%; background: var(--navy); border: 1px solid var(--border); border-radius: 7px; padding: 9px 11px; font-size: 13px; color: var(--text); outline: none; }
  .field-input:focus { border-color: var(--accent); }
  .field-textarea { width: 100%; background: var(--navy); border: 1px solid var(--border); border-radius: 7px; padding: 10px 12px; font-size: 12.5px; color: #a8d8f0; outline: none; font-family: var(--font-mono); resize: vertical; min-height: 160px; line-height: 1.65; }
  .field-textarea:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; padding-top: 4px; }
  .save-btn { background: var(--accent); color: #0a1628; border: none; border-radius: 7px; padding: 9px 22px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .save-btn:hover { background: var(--accent2); }
  .cancel-btn { background: transparent; color: var(--text2); border: 1px solid var(--border); border-radius: 7px; padding: 9px 16px; font-size: 13px; cursor: pointer; }
  .toast { position: fixed; bottom: 24px; right: 24px; background: var(--accent2); color: #0a1628; border-radius: 8px; padding: 9px 18px; font-size: 12px; font-weight: 600; z-index: 200; display: none; }
  .server-err { background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: #ff6b6b; font-size: 12px; padding: 8px 14px; border-radius: 7px; margin: 10px 14px; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--navy3); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <span class="topbar-title">&#9670; ABAP Programs Vault</span>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <circle cx="6.5" cy="6.5" r="4.5"/>
        <line x1="10.5" y1="10.5" x2="14" y2="14"/>
      </svg>
      <input type="text" id="searchInput" placeholder="Search by name, tag, T-code..." oninput="renderList()">
    </div>
    <button class="add-btn" onclick="openModal()">+ Add Program</button>
  </div>
  <div class="main">
    <div class="list-panel" id="listPanel"></div>
    <div class="detail-panel" id="detailPanel">
      <div class="empty-state">
        <div class="empty-icon">&#128196;</div>
        <span>Select a program to view details</span>
      </div>
    </div>
  </div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Add Program</h3>
    <div class="field-group">
      <div class="field-label">Program Name *</div>
      <input class="field-input" id="fName" placeholder="e.g. Z_HELLO_WORLD">
    </div>
    <div class="field-group">
      <div class="field-label">Description *</div>
      <input class="field-input" id="fDesc" placeholder="What does this program do?">
    </div>
    <div class="field-group">
      <div class="field-label">T-Code (optional)</div>
      <input class="field-input" id="fTcode" placeholder="e.g. SE38">
    </div>
    <div class="field-group">
      <div class="field-label">Tags (comma-separated)</div>
      <input class="field-input" id="fTags" placeholder="e.g. OOP, DDIC, Internal Tables">
    </div>
    <div class="field-group">
      <div class="field-label">ABAP Code *</div>
      <textarea class="field-textarea" id="fCode" placeholder="Paste your ABAP code here..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="save-btn" onclick="saveProgram()">Save Program</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">&#10003; Copied!</div>

<script>
  const API = 'http://localhost:5000';
  let programs = [];
  let selectedId = null;
  let editingId = null;

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  async function loadPrograms() {
    try {
      const res = await fetch(`${API}/programs`);
      programs = await res.json();
      renderList();
      if (programs.length > 0) selectProgram(programs[0].id);
    } catch(e) {
      document.getElementById('listPanel').innerHTML =
        '<div class="server-err">&#9888; Cannot connect to server.<br>Run: <b>py server.py</b></div>';
    }
  }

  function renderList() {
    const q = document.getElementById('searchInput').value.toLowerCase();
    const panel = document.getElementById('listPanel');
    const filtered = programs.filter(p =>
      p.name.toLowerCase().includes(q) ||
      p.description.toLowerCase().includes(q) ||
      (p.tcode && p.tcode.toLowerCase().includes(q)) ||
      (p.tags && p.tags.toLowerCase().includes(q))
    );
    if (programs.length === 0) {
      panel.innerHTML = '<div class="empty-state" style="padding:30px;text-align:center;font-size:12px;color:var(--text2)">No programs yet.<br>Click "+ Add Program"</div>';
      return;
    }
    if (filtered.length === 0) {
      panel.innerHTML = '<div style="padding:20px;text-align:center;font-size:12px;color:var(--text2)">No matches found.</div>';
      return;
    }
    panel.innerHTML = `<div class="list-count">${filtered.length} program${filtered.length !== 1 ? 's' : ''}</div>` +
      filtered.map(p => {
        const tags = p.tags ? p.tags.split(',').map(t => t.trim()).filter(Boolean) : [];
        return `
          <div class="prog-item ${p.id === selectedId ? 'active' : ''}" onclick="selectProgram(${p.id})">
            <div class="prog-item-name">${escHtml(p.name)}</div>
            <div class="prog-item-desc">${escHtml(p.description)}</div>
            <div class="prog-item-tags">${tags.slice(0,4).map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}</div>
          </div>`;
      }).join('');
  }

  function selectProgram(id) {
    selectedId = id;
    renderList();
    const p = programs.find(x => x.id === id);
    if (!p) return;
    const tags = p.tags ? p.tags.split(',').map(t => t.trim()).filter(Boolean) : [];
    document.getElementById('detailPanel').innerHTML = `
      <div>
        <div class="detail-title">${escHtml(p.name)}</div>
        <div class="detail-desc">${escHtml(p.description)}</div>
      </div>
      <div class="meta-row">
        ${p.tcode ? `<span class="meta-badge">T-Code: ${escHtml(p.tcode)}</span>` : ''}
        <span class="meta-badge">&#128197; ${escHtml(p.created_at)}</span>
        ${tags.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}
      </div>
      <div class="code-block">
        <div class="code-header">
          <span class="code-label">ABAP CODE</span>
          <div class="code-actions">
            <button class="code-btn" onclick="copyCode(${id})">&#128203; Copy</button>
            <button class="code-btn" onclick="editProgram(${id})">&#9998; Edit</button>
          </div>
        </div>
        <div class="code-content">${escHtml(p.code)}</div>
      </div>
      <div class="detail-actions">
        <button class="edit-btn" onclick="editProgram(${id})">&#9998; Edit Program</button>
        <button class="del-btn" onclick="deleteProgram(${id})">&#10005; Delete</button>
      </div>
    `;
  }

  function copyCode(id) {
    const p = programs.find(x => x.id === id);
    if (!p) return;
    navigator.clipboard.writeText(p.code).then(() => showToast());
  }

  async function deleteProgram(id) {
    if (!confirm('Delete this program?')) return;
    await fetch(`${API}/programs/${id}`, { method: 'DELETE' });
    selectedId = null;
    document.getElementById('detailPanel').innerHTML = `
      <div class="empty-state"><div class="empty-icon">&#128196;</div><span>Select a program</span></div>`;
    await loadPrograms();
  }

  function openModal(id) {
    editingId = id || null;
    const p = id ? programs.find(x => x.id === id) : null;
    document.getElementById('modalTitle').textContent = p ? 'Edit Program' : 'Add Program';
    document.getElementById('fName').value = p ? p.name : '';
    document.getElementById('fDesc').value = p ? p.description : '';
    document.getElementById('fTcode').value = p ? (p.tcode || '') : '';
    document.getElementById('fTags').value = p ? (p.tags || '') : '';
    document.getElementById('fCode').value = p ? p.code : '';
    document.getElementById('modalBg').classList.add('open');
    setTimeout(() => document.getElementById('fName').focus(), 100);
  }

  function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
  function editProgram(id) { openModal(id); }

  async function saveProgram() {
    const name = document.getElementById('fName').value.trim();
    const description = document.getElementById('fDesc').value.trim();
    const code = document.getElementById('fCode').value.trim();
    if (!name || !description || !code) { alert('Name, description and code are required.'); return; }
    const payload = {
      name, description, code,
      tcode: document.getElementById('fTcode').value.trim(),
      tags: document.getElementById('fTags').value.trim(),
      created_at: new Date().toLocaleDateString('en-IN')
    };
    if (editingId) {
      await fetch(`${API}/programs/${editingId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    } else {
      await fetch(`${API}/programs`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
    }
    closeModal();
    await loadPrograms();
    if (editingId) selectProgram(editingId);
    else if (programs.length > 0) selectProgram(programs[0].id);
  }

  function showToast() {
    const t = document.getElementById('toast');
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
  }

  document.getElementById('modalBg').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  loadPrograms();
</script>
</body>
</html>
